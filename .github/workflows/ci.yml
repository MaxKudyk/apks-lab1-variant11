name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify with Maven on Windows
        if: runner.os == 'Windows'
        run: .\ci.bat
        shell: cmd

      - name: Verify with Maven on Linux and macOS
        if: runner.os != 'Windows'
        run: bash ./ci.sh

      - name: Upload runnable JAR
        uses: actions/upload-artifact@v4
        with:
          name: apks-lab1-variant11-${{ matrix.os }}
          path: target/apks-lab1-variant11-1.0-SNAPSHOT.jar
          if-no-files-found: error
